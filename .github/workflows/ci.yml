name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node.js checks (Devobs shared)
    permissions:
      contents: read
    uses: hamedonassar95/Devobs/.github/workflows/reusable-node-ci.yml@6fae8aa9bd438f5c5e3d4122e953ffe90982b792
    with:
      node_version: "22"

  verify:
    name: Tenant database, Terraform, and container checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://devobs_app:ci-password@localhost:5432/devobs_saas?schema=public
      DIRECT_URL: postgresql://devobs_app:ci-password@localhost:5432/devobs_saas?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -lockfile=readonly -input=false
          terraform -chdir=infra/terraform validate
      - run: npm ci
      - run: npx prisma generate
      - name: Create non-superuser application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE devobs_app LOGIN PASSWORD 'ci-password' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE devobs_saas OWNER devobs_app"
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - name: Build production container
        run: docker build --target runner --tag devobs-saas:ci .
      - name: Build migration job container
        run: docker build --target migrator --tag devobs-saas:migrator-ci .

  deploy-netlify:
    name: Deploy production to Netlify
    needs: [node, verify]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.NETLIFY_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
    environment: production
    concurrency:
      group: netlify-production-deployment
      cancel-in-progress: false
    env:
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${NETLIFY_SITE_ID:?Set NETLIFY_SITE_ID in the production environment}"
          : "${NETLIFY_AUTH_TOKEN:?Set NETLIFY_AUTH_TOKEN in the production environment secrets}"
          : "${DATABASE_URL:?Set NEON_DATABASE_URL in the production environment secrets}"
          : "${DIRECT_URL:?Set NEON_DIRECT_URL in the production environment secrets}"
          : "${APP_URL:?Set APP_URL in the production environment variables}"
          case "$APP_URL" in https://*) ;; *) echo "APP_URL must use HTTPS" >&2; exit 1 ;; esac

      - name: Install locked dependencies
        run: npm ci

      - name: Build the production Netlify bundle
        run: npx --yes --package=netlify-cli@27.14.0 netlify build --context production

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Publish production deploy
        run: npx --yes --package=netlify-cli@27.14.0 netlify deploy --no-build --prod --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify the live application and database
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 6 --retry-connrefused \
            "${APP_URL%/}/api/health"
